name: transport committed evidence

# Reruns every validation that is possible from a clean GitHub checkout.
#
# What this workflow does NOT do, and must never claim to do: verify the bytes
# of the raw tuning and evaluation files. `results/raw/` is not committed, so
# the detached verifier reports those checks as STRUCTURAL PASS or NOT EXECUTED
# and this job inherits that distinction verbatim.

on:
  push:
    paths:
      - "**"
      - "!buck-out/**"
      - "!results/logs/**"
      - "!results/raw/**"
      - "paper/**"
      - "experiments/**"
      - "results/derived/**"
      - "review/**"
      - "submissions/**"
      - "tools/**"
      - "tests/**"
      - "third_party/**"
      - ".buck2"
      - ".buckconfig"
      - "BUCK"
      - "BUCK2_SETUP.md"
      - "PACKAGE"
      - "*.bzl"
      - "*.py"
      - "*.pyc"
      - "*.pyi"
      - "*.pyo"
      - "*.so"
      - "**/*.bzl"
      - "**/*.py"
      - "**/*.pyc"
      - "**/*.pyi"
      - "**/*.pyo"
      - "**/*.so"
      - "Makefile"
      - "pytest.ini"
      - "TRANSPORT_INSTANTIATION_COMPLETION_REPORT.md"
      - "GITHUB_ONLY_TRANSPORT_REVIEW.md"
      - ".github/workflows/transport-committed-evidence.yml"
  pull_request:
    paths:
      - "**"
      - "!buck-out/**"
      - "!results/logs/**"
      - "!results/raw/**"
      - "paper/**"
      - "experiments/**"
      - "results/derived/**"
      - "review/**"
      - "submissions/**"
      - "tools/**"
      - "tests/**"
      - "third_party/**"
      - ".buck2"
      - ".buckconfig"
      - "BUCK"
      - "BUCK2_SETUP.md"
      - "PACKAGE"
      - "*.bzl"
      - "*.py"
      - "*.pyc"
      - "*.pyi"
      - "*.pyo"
      - "*.so"
      - "**/*.bzl"
      - "**/*.py"
      - "**/*.pyc"
      - "**/*.pyi"
      - "**/*.pyo"
      - "**/*.so"
      - "Makefile"
      - "pytest.ini"
      - "TRANSPORT_INSTANTIATION_COMPLETION_REPORT.md"
      - "GITHUB_ONLY_TRANSPORT_REVIEW.md"
      - ".github/workflows/transport-committed-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transport-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything the TMLR submission candidate depends on.  It must be able to
  # run, and to be read, without the deferred realistic-transport extension:
  # that extension is a separate job below so that its real status neither
  # blocks nor is hidden by this one.
  submission-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # actions/checkout v4.2.2
      - name: Check out at full depth
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # actions/setup-python v5.3.0
      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"

      - name: Install the declared experiment dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiments/requirements.txt
          # CI-only: PyYAML is not a scientific dependency and is deliberately
          # not added to experiments/requirements.txt.  It is installed here so
          # the workflow-structure regression test can parse this file rather
          # than pattern-match it.
          python -m pip install "pyyaml==6.0.2"

      - name: Show tool versions
        run: |
          python --version
          python -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"

      - name: Confirm the raw results tree is absent
        run: |
          if [ -d results/raw ]; then
            echo "results/raw/ is present; this job asserts the GitHub-only case" >&2
            exit 1
          fi
          echo "results/raw/ absent, as expected for a clean GitHub checkout"

      - name: Validate SHA-256 sidecars
        run: |
          set -euo pipefail
          status=0
          mapfile -t sidecars < <(
            find paper results review submissions -name '*.sha256' -type f 2>/dev/null | sort
          )
          if [ "${#sidecars[@]}" -eq 0 ]; then
            echo "no SHA-256 sidecars were discovered" >&2
            exit 1
          fi
          mapfile -t review_sidecars < <(
            find review -name '*.sha256' -type f 2>/dev/null | sort
          )
          if [ "${#review_sidecars[@]}" -eq 0 ]; then
            echo "no review SHA-256 sidecars were discovered" >&2
            exit 1
          fi
          for sidecar in "${sidecars[@]}"; do
            dir=$(dirname "$sidecar")
            if ! ( cd "$dir" && sha256sum -c "$(basename "$sidecar")" >/dev/null ); then
              echo "sidecar mismatch: $sidecar" >&2
              status=1
            fi
          done
          echo "checked ${#sidecars[@]} SHA-256 sidecars"
          echo "checked ${#review_sidecars[@]} review SHA-256 sidecars"
          ( cd submissions/code_mit_2026 && sha256sum -c SHA256SUMS )
          exit $status

      - name: Transport unit, aggregate and artifact tests
        run: |
          python -m pytest -q \
            experiments/tests/test_transport_instantiation.py \
            experiments/tests/test_transport_instantiation_aggregate.py \
            experiments/tests/test_transport_instantiation_artifacts.py

      - name: Review-bundle tests
        run: python -m pytest -q tests/test_transport_github_review_bundle.py

      - name: Detached committed-evidence verifier
        run: |
          set -euo pipefail
          python tools/verify_transport_committed_evidence.py \
            --json verifier-report.json | tee verifier.log

      - name: Regenerate the review bundle and require an exact match
        run: |
          python tools/export_transport_github_review_bundle.py \
            --output "${RUNNER_TEMP}/transport-review-bundle"
          diff -ru \
            --exclude=pdf \
            review/transport_instantiation \
            "${RUNNER_TEMP}/transport-review-bundle"
          echo "review bundle is byte-identical to the committed copy"

      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils qpdf ghostscript

      - name: PDF structural checks
        run: |
          set -euo pipefail
          # The sidecar names the file as bare `main.pdf`, so sha256sum -c has to
          # run from paper/.  Called from the repository root it reports
          # "main.pdf: FAILED open or read" and exits 1, which used to abort this
          # job before any submission check ran.
          ( cd paper && sha256sum -c main.pdf.sha256 )
          qpdf --check paper/main.pdf | tee pdf-check.log
          pdfinfo paper/main.pdf | tee -a pdf-check.log
          pdffonts paper/main.pdf | tee -a pdf-check.log
          pdftotext -layout paper/main.pdf "${RUNNER_TEMP}/main.txt"
          wc -c "${RUNNER_TEMP}/main.txt" | tee -a pdf-check.log
          # the PDF must be untouched by the checks above
          ( cd paper && sha256sum -c main.pdf.sha256 )

      - name: Static TeX validation
        run: python paper/validate.py

      - name: Install TeX Live for the manuscript builds
        run: |
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-science \
            texlive-pictures texlive-plain-generic cm-super biber latexmk unzip

      - name: Numerical-provenance ledger
        run: |
          set -euo pipefail
          python tools/verify_tmlr_submission_numbers.py \
            --ledger ledger.json | tee ledger.log

      - name: Regenerate every published artifact from the locked aggregate
        run: |
          set -euo pipefail
          python tools/transport_artifact_expectations.py --root . \
            | tee artifact-regeneration.log
          # the check runs in memory; prove it wrote nothing
          git diff --quiet --exit-code -- paper/tables paper/figures

      - name: Attempt the clean PDF rebuild
        run: |
          set -euo pipefail
          # Two different questions, kept apart.
          #
          # (1) Does the current source compile cleanly?  That must pass, and a
          #     build failure or an unresolved reference fails this step.
          # (2) Do the resulting bytes equal paper/main.pdf?  They are not
          #     expected to: that file is a deliberately frozen pre-rewrite
          #     snapshot, and its hash and provenance are verified separately by
          #     "PDF structural checks" above.  A difference is therefore
          #     reported as a classification, not as a failure.  Treating (2) as
          #     a hard gate is what previously stopped this job before the
          #     submission checks below ever ran.
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH FORCE_SOURCE_DATE=1
          work="${RUNNER_TEMP}/aistats"
          mkdir -p "$work"
          git archive HEAD | tar -x -C "$work"
          cp paper/main.pdf "${RUNNER_TEMP}/locked.pdf"
          ( cd "$work/paper" && latexmk -pdf -interaction=nonstopmode \
              -halt-on-error main.tex ) > aistats-build.log 2>&1 || {
            echo "classification: current sources do not compile" >&2
            tail -80 aistats-build.log >&2
            exit 1
          }
          log="$work/paper/main.log"
          if grep -qE 'LaTeX Warning: (Reference|Citation|Label)' "$log"; then
            echo "unresolved references, citations or labels in the build" >&2
            grep -E 'LaTeX Warning: (Reference|Citation|Label)' "$log" >&2
            exit 1
          fi
          pages=$(pdfinfo "$work/paper/main.pdf" | awk '/^Pages:/{print $2}')
          echo "current AISTATS entry point compiles: ${pages} pages"
          if cmp -s "$work/paper/main.pdf" "${RUNNER_TEMP}/locked.pdf"; then
            echo "classification: byte-identical to the frozen snapshot"
          else
            locked_pages=$(pdfinfo "${RUNNER_TEMP}/locked.pdf" \
              | awk '/^Pages:/{print $2}')
            echo "classification: current sources differ from the frozen" \
                 "pre-rewrite snapshot (${pages} pages now, ${locked_pages}" \
                 "pages frozen); expected, not a failure"
          fi
          # the frozen snapshot must still be untouched by any of the above
          ( cd paper && sha256sum -c main.pdf.sha256 )

      - name: Build the anonymous TMLR submission
        run: |
          set -euo pipefail
          TMLR_OUT="${RUNNER_TEMP}/tmlr" bash submissions/tmlr_2026/build.sh \
            > tmlr-build.log 2>&1 || { tail -80 tmlr-build.log; exit 1; }
          tail -20 tmlr-build.log
          test -f "${RUNNER_TEMP}/tmlr/main.pdf"
          test -f "${RUNNER_TEMP}/tmlr/source.zip"
          test -f "${RUNNER_TEMP}/tmlr/supplement.zip"
          # the supplement must stay inside the 100 MB venue limit.  Strictly
          # under, matching package.check_archive_size: the archive stores its
          # members rather than deflating them, so this has real headroom to
          # spend and the gate has to be the one that notices.
          limit=$((100 * 1000 * 1000))
          size=$(stat -c%s "${RUNNER_TEMP}/tmlr/supplement.zip")
          echo "supplement.zip: ${size} bytes (limit ${limit})"
          [ "$size" -lt "$limit" ]
          # every member STORED, so the archive hash cannot move with zlib,
          # and every external compiled input from a trusted system tree
          python - "${RUNNER_TEMP}/tmlr" <<'PY'
          import json, pathlib, sys, zipfile
          out = pathlib.Path(sys.argv[1])
          for name in ("source.zip", "supplement.zip"):
              with zipfile.ZipFile(out / name) as archive:
                  bad = [i.filename for i in archive.infolist()
                         if i.compress_type != zipfile.ZIP_STORED]
              print(f"{name}: {len(bad)} deflated members")
              if bad:
                  raise SystemExit(f"{name} carries deflated members: {bad[:5]}")
          manifest = json.loads(
              (out / "release_manifest.json").read_text(encoding="utf-8"))
          external = manifest["external_tex_inputs"]
          untrusted = [i["name"] for i in external if not i["trusted"]]
          print(f"external compiled inputs: {len(external)}, "
                f"{len(untrusted)} not from a trusted system tree")
          if untrusted or not external:
              raise SystemExit(f"external inputs not trusted: {untrusted[:5]}")
          PY
          # the build writes only outside the repository: no tracked file may
          # have changed, and no new file may have appeared under a protected path
          git diff --quiet --exit-code
          git status --porcelain --untracked-files=all -- \
            paper results review submissions experiments tools \
            | tee tmlr-tree-state.log
          [ ! -s tmlr-tree-state.log ]

      - name: Release manifest still describes the rebuilt deliverables
        run: |
          set -euo pipefail
          python submissions/tmlr_2026/package.py --compare-manifest \
            "${RUNNER_TEMP}/tmlr/release_manifest.json"

      - name: Rebuild the submission from a clean unpacked source.zip
        run: |
          set -euo pipefail
          clean="${RUNNER_TEMP}/source-zip-check"
          rm -rf "$clean"; mkdir -p "$clean"
          ( cd "$clean" && unzip -q "${RUNNER_TEMP}/tmlr/source.zip" )
          export SOURCE_DATE_EPOCH=1609459200 FORCE_SOURCE_DATE=1
          ( cd "$clean" && latexmk -pdf -interaction=nonstopmode -halt-on-error \
              main.tex ) > source-zip-build.log 2>&1
          cmp "$clean/main.pdf" "${RUNNER_TEMP}/tmlr/main.pdf"
          echo "source.zip rebuilds the submitted PDF byte-identically"

      - name: Release-package suite against the built output
        run: |
          set -euo pipefail
          # TMLR_OUT points the suite at the archives this job actually built,
          # so the integration tests grade the real deliverables instead of
          # skipping for want of one.  The log goes to RUNNER_TEMP: nothing this
          # job writes may land in the worktree.
          log="${RUNNER_TEMP}/release-package-suite.log"
          TMLR_OUT="${RUNNER_TEMP}/tmlr" \
            python -m pytest -q -rs tests/test_tmlr_release_package.py \
            | tee "$log"
          if grep -q "no built release directory" "$log"; then
            echo "the suite skipped its archive tests: TMLR_OUT was not honoured" >&2
            exit 1
          fi
          git diff --quiet --exit-code
          git status --porcelain --untracked-files=all -- \
            paper results review submissions experiments tools tests \
            | tee "${RUNNER_TEMP}/package-suite-tree-state.log"
          [ ! -s "${RUNNER_TEMP}/package-suite-tree-state.log" ]

      - name: Verify the generated supplement from a clean unpack
        run: |
          set -euo pipefail
          # The reviewer's entry point, run exactly as shipped: unpack the
          # supplement this job produced and execute its own verify.sh with no
          # edits and no environment help from the repository.
          clean="${RUNNER_TEMP}/supplement-check"
          rm -rf "$clean"; mkdir -p "$clean"
          ( cd "$clean" && unzip -q "${RUNNER_TEMP}/tmlr/supplement.zip" )
          log="${RUNNER_TEMP}/supplement-verify.log"
          ( cd "$clean" && bash verify.sh ) | tee "$log"
          grep -q "all supplement checks passed" "$log"
          git diff --quiet --exit-code
          git status --porcelain --untracked-files=all -- \
            paper results review submissions experiments tools tests \
            | tee "${RUNNER_TEMP}/supplement-tree-state.log"
          [ ! -s "${RUNNER_TEMP}/supplement-tree-state.log" ]

      # actions/upload-artifact v4.4.3
      - name: Upload verifier and PDF logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: transport-evidence-logs
          path: |
            verifier.log
            verifier-report.json
            pdf-check.log
            ledger.json
            ledger.log
            artifact-regeneration.log
            aistats-build.log
            tmlr-build.log
            source-zip-build.log
            ${{ runner.temp }}/release-package-suite.log
            ${{ runner.temp }}/supplement-verify.log
          if-no-files-found: warn
          retention-days: 30

  # The deferred realistic Covertype/Nystrom extension.  It is NOT part of the
  # submission and is NOT cleared: an independent review of this revision left
  # its evidence-integrity blockers open, and raw-grid discovery still collapses
  # the physical seed-100 and seed-0100 directories into one integer-keyed cell.
  # This job runs it anyway and reports its true status; it is deliberately not
  # a dependency of submission-evidence, and a failure here must never be read
  # as clearance or as a submission blocker.
  realistic-transport-deferred:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # actions/checkout v4.2.2
      - name: Check out at full depth
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # actions/setup-python v5.3.0
      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"

      - name: Install the declared experiment dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r experiments/requirements.txt

      - name: Collect realistic trust-boundary tests
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q experiments/realistic_transport \
            | tee realistic-transport-collection.log

      - name: Run realistic trust-boundary tests
        run: |
          set -euo pipefail
          python -m pytest -q experiments/realistic_transport \
            | tee realistic-transport-tests.log

      # actions/upload-artifact v4.4.3
      - name: Upload realistic-transport logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: realistic-transport-logs
          path: |
            realistic-transport-collection.log
            realistic-transport-tests.log
          if-no-files-found: warn
          retention-days: 30
