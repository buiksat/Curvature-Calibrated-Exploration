{
  "schema_version": 1,
  "name": "balanced_benchmark",
  "description": "Balanced synthetic contextual benchmark with matched linear, neural, diagonal, greedy, and context-free policies.",
  "base": {
    "task": "balanced_nonlinear_contextual_bandit",
    "rounds": 200,
    "tuning_rounds": 80,
    "horizons": [50, 100, 200],
    "environment": {
      "context_distribution": "normalized_rademacher",
      "context_dimension": 4,
      "action_count": 5,
      "noise_std": 0.10,
      "teacher": "default_balanced_shared_backbone_tanh_teacher"
    },
    "methods": [
      "linucb",
      "linear_ts",
      "cc_ucb_full_ggn_cg",
      "neural_linear",
      "neural_ucb",
      "neural_ts",
      "diagonal_full_network_ucb",
      "frozen_last_layer_ucb",
      "greedy_full_network",
      "gaussian_ucb1",
      "gaussian_context_free_ts"
    ],
    "method_semantics": {
      "cc_ucb_full_ggn_cg": "Current-parameter relinearization of all selected historical samples, with one fixed matrix-free full-GGN operator per round and residual-checked CG for every candidate action.",
      "neural_linear": "Frozen initialized tanh representation with an exact Gaussian Bayesian linear posterior over the action-specific head; Thompson sampling uses a posterior draw.",
      "frozen_last_layer_ucb": "The same frozen-representation Gaussian Bayesian linear posterior as neural_linear, with a UCB action rule.",
      "neural_ucb": "Local full-network linearized UCB implementation; not claimed to reproduce every detail of a published NeuralUCB implementation.",
      "neural_ts": "Local full-network linearized Gaussian posterior-sampling implementation; not claimed to reproduce every detail of a published NeuralTS implementation.",
      "diagonal_full_network_ucb": "Local diagonal approximation to the full-network linearized UCB precision.",
      "full_network_update_budget": "One clipped float64 SGD step per observed reward for cc_ucb_full_ggn_cg, neural_ucb, neural_ts, diagonal_full_network_ucb, and greedy_full_network."
    },
    "cg": {
      "relative_residual_tolerance": 1e-10,
      "max_iterations": 180,
      "initial_solution": "zero",
      "separate_per_action_residual_check": true
    },
    "sanity_check": {
      "predefined_contextual_method": "linucb",
      "context_free_methods": ["gaussian_ucb1", "gaussian_context_free_ts"],
      "criterion": "lower mean cumulative pseudo-regret on the untouched evaluation seeds"
    },
    "ridge_grid": [0.5, 1.0],
    "bonus_grid": [0.5, 1.0, 2.0],
    "model": {
      "architecture": "one_hidden_layer_tanh_width4",
      "learning_rate": 0.01,
      "model_ridge": 0.01,
      "updates_per_round": 1,
      "maximum_step_norm": 0.025,
      "dtype": "float64"
    },
    "selection": {
      "criterion": "mean_cumulative_pseudo_regret",
      "selected_on": "tuning_seeds_only",
      "evaluation_rerun_from_scratch": true,
      "common_random_numbers_within_seed": true,
      "tie_break": "lowest_configured_grid_order"
    },
    "output_root": "results/raw/balanced_benchmark",
    "provenance": {"packages": ["numpy", "scipy", "psutil"]}
  },
  "profiles": {
    "smoke": {
      "rounds": 24,
      "tuning_rounds": 16,
      "horizons": [12, 24],
      "ridge_grid": [1.0],
      "bonus_grid": [1.0],
      "seed_sets": {"tuning": [70, 71], "evaluation": [260, 261]}
    },
    "full": {
      "seed_sets": {
        "tuning": [70, 71, 72, 73, 74, 75, 76, 77, 78, 79],
        "evaluation": [260, 261, 262, 263, 264, 265, 266, 267, 268, 269, 270, 271, 272, 273, 274, 275, 276, 277, 278, 279, 280, 281, 282, 283, 284, 285, 286, 287, 288, 289]
      }
    }
  }
}
